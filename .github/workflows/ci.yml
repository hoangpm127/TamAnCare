name: Quality Gate

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tam_an_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tam_an_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tam_an_test?schema=public
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      RATE_LIMIT_SECRET: ci-rate-limit-secret-with-at-least-32-characters
      MFA_ENCRYPTION_KEY: Y2ktbWZhLWtleS0zMi1ieXRlcy0wMTIzNDU2Nzg5YWI=
      SESSION_COOKIE_SECURE: "false"
      SEPAY_WEBHOOK_SECRET: local-e2e-webhook-secret
      SEPAY_ACCOUNT_NUMBERS: "1234567890,766996789"
      NEXT_PUBLIC_PACKAGE_PAYMENT_BANK_ID: "MBBank"
      NEXT_PUBLIC_PACKAGE_PAYMENT_BANK_NAME: "MBBank"
      NEXT_PUBLIC_PACKAGE_PAYMENT_ACCOUNT_NUMBER: "766996789"
      NEXT_PUBLIC_PACKAGE_PAYMENT_ACCOUNT_HOLDER: "NGUYEN VAN NGOC"
      CRON_SECRET: ci-cron-secret-with-at-least-32-characters
      TEST_SEPAY_WEBHOOK_SECRET: local-e2e-webhook-secret
      TEST_SEPAY_ACCOUNT_NUMBER: "1234567890"
      TEST_SEPAY_GENERAL_ACCOUNT: "1234567890"
      TEST_SEPAY_PACKAGE_ACCOUNT: "766996789"
      ALLOW_DESTRUCTIVE_SEED: DELETE_AND_REBUILD_DEMO_DATABASE
      SEED_OWNER_PASSWORD: CI-Owner-Password!2026
      SEED_MANAGER_CS1_PASSWORD: CI-Manager-CS1!2026
      SEED_MANAGER_CS2_PASSWORD: CI-Manager-CS2!2026
      SEED_RECEPTION_CS1_PASSWORD: CI-Reception-CS1!2026
      SEED_RECEPTION_CS2_PASSWORD: CI-Reception-CS2!2026
      SEED_INVESTOR_PASSWORD: CI-Investor-Password!2026
      SEED_THERAPIST_PASSWORD: CI-Therapist-Password!2026
      SEED_CUSTOMER_PASSWORD: CI-Customer-Password!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Run production server and core flows
        run: |
          npm start > /tmp/tam-an-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          npm run test:flows
